# Streamlit の設定（ローカルで analytics フォルダから起動したときに読まれる）
#
# Streamlit Community Cloud ではこのファイルは読まれず、リポジトリ直下の .streamlit/config.toml が使われる
# （Community Cloud の作業ディレクトリは常にリポジトリ直下のため）。
# [theme]・[client]・[browser] を変えるときは、このファイルとリポジトリ直下の .streamlit/config.toml の両方をそろえること。

[theme]
# 画面は明るいテーマに固定する（グラフの配色は明るい背景で検証しているため）
base = "light"
# ボタン・選択中の項目などの色（管理画面と同じ緑）
primaryColor = "#4a6741"
# ページ背景とグラフ背景を揃える
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"

[server]
# ローカルで動かすときの設定。自分の PC からだけ開けるようにする
# Community Cloud ではアドレス・ポートは Community Cloud が決める（リポジトリ直下の設定にも [server] は書かない）
# XSRF 保護（enableXsrfProtection）・CORS（enableCORS）は既定の有効のままにする。ここで無効にしないこと
address = "localhost"
port = 8501

[client]
# 予期しないエラーが起きても、エラーの詳細（ファイルの場所など）を画面に出さない（公開時の情報漏れ対策）
showErrorDetails = "none"

[browser]
# 利用状況の送信をしない
gatherUsageStats = false
