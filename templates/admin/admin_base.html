<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}Admin{% endblock %} | ei8ht plants</title>
    <link rel="icon" type="image/png" href="/static/favicon/favicon-ei8htplants.png">
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --sidebar-bg: #1c2417;
            --sidebar-active: rgba(255,255,255,0.13);
            --sidebar-hover: rgba(255,255,255,0.07);
            --body-bg: #f2f0ec;
            --card-bg: #ffffff;
            --border: #e0dbd0;
            --text: #1c2417;
            --muted: #7a7168;
            --accent: #4a6741;
            --accent-soft: #eef1ea;
            --danger: #b3462c;
            --danger-soft: #f6e6e2;
            --warn-soft: #f3ece0;
            --warn: #93692b;
        }

        html, body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Noto Sans JP", sans-serif;
            font-size: 14px;
            color: var(--text);
            background: var(--body-bg);
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }

        /* ================================
           レイアウト
           ================================ */
        .admin-shell { display: flex; min-height: 100vh; }

        /* サイドバー */
        .admin-sidebar {
            width: 220px;
            background: var(--sidebar-bg);
            color: #fff;
            padding: 28px 16px 24px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar-logo {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            margin-bottom: 6px;
            color: #fff;
        }
        .sidebar-logo small {
            display: block;
            font-size: 9px;
            font-weight: 400;
            letter-spacing: .2em;
            color: rgba(255,255,255,.45);
            margin-top: 3px;
        }
        .sidebar-divider { border: none; border-top: 1px solid rgba(255,255,255,.1); margin: 20px 0; }
        .sidebar-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
        .sidebar-nav-link {
            display: block;
            padding: 10px 12px;
            font-size: 12px;
            letter-spacing: .06em;
            color: rgba(255,255,255,.65);
            border-radius: 6px;
            transition: background .15s, color .15s;
        }
        .sidebar-nav-link:hover { background: var(--sidebar-hover); color: rgba(255,255,255,.9); }
        .sidebar-nav-link.is-active { background: var(--sidebar-active); color: #fff; font-weight: 600; }
        .sidebar-logout {
            display: block;
            padding: 10px 12px;
            font-size: 11px;
            letter-spacing: .06em;
            color: rgba(255,255,255,.35);
            border-radius: 6px;
            transition: color .15s;
            margin-top: auto;
        }
        .sidebar-logout:hover { color: rgba(255,255,255,.7); }

        /* メインエリア */
        .admin-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

        .admin-topbar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .admin-topbar h1 {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: .04em;
            margin: 0;
        }
        .admin-topbar-actions { display: flex; align-items: center; gap: 10px; }

        .admin-content { padding: 32px 36px 60px; }

        /* ================================
           カード
           ================================ */
        .admin-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .admin-card--pad { padding: 24px 28px; }

        /* ================================
           フラッシュ
           ================================ */
        .flash {
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 13px;
            background: var(--accent-soft);
            border: 1px solid #c5d8c0;
            color: var(--accent);
            border-radius: 4px;
        }
        .flash--error {
            background: var(--danger-soft);
            border-color: #e8c0b8;
            color: var(--danger);
        }

        /* ================================
           ツールバー（検索・フィルター）
           ================================ */
        .admin-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .admin-toolbar-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .toolbar-search input {
            border: 1px solid var(--border);
            padding: 8px 12px;
            font-size: 13px;
            font-family: inherit;
            background: var(--card-bg);
            color: var(--text);
            width: 220px;
        }
        .toolbar-search input:focus { outline: none; border-color: var(--accent); }
        .toolbar-select {
            border: 1px solid var(--border);
            padding: 8px 10px;
            font-size: 12.5px;
            font-family: inherit;
            background: var(--card-bg);
            color: var(--text);
        }

        /* ================================
           タブ
           ================================ */
        .tab-bar {
            display: flex;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 10px 20px;
            font-size: 12px;
            letter-spacing: .05em;
            color: var(--muted);
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            cursor: pointer;
            font-family: inherit;
            transition: color .15s;
        }
        .tab-btn:hover { color: var(--text); }
        .tab-btn.active { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        /* ================================
           テーブル
           ================================ */
        .table-wrap { overflow-x: auto; }
        .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .admin-table th {
            text-align: left;
            padding: 11px 14px;
            background: #f7f5f1;
            font-weight: 500;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: .05em;
            white-space: nowrap;
            border-bottom: 1px solid var(--border);
        }
        .admin-table td {
            padding: 13px 14px;
            border-bottom: 1px solid #f0ebe3;
            vertical-align: middle;
        }
        .admin-table tr:last-child td { border-bottom: none; }
        .admin-table tbody tr:hover td { background: #faf8f5; }

        /* セルごと */
        .td-muted { color: var(--muted); font-size: 12px; }
        .td-bold { font-weight: 600; }
        .td-nowrap { white-space: nowrap; }
        .td-right { text-align: right; }

        /* ================================
           pill バッジ
           ================================ */
        .pill {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 999px;
            display: inline-block;
            white-space: nowrap;
        }
        .pill--ok { background: var(--accent-soft); color: var(--accent); }
        .pill--wait { background: var(--warn-soft); color: var(--warn); }
        .pill--off { background: #ece9e4; color: var(--muted); }
        .pill--danger { background: var(--danger-soft); color: var(--danger); }

        /* ================================
           ボタン
           ================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 20px;
            font-size: 12px;
            letter-spacing: .06em;
            border: 1px solid var(--text);
            background: var(--text);
            color: #fff;
            cursor: pointer;
            font-family: inherit;
            transition: opacity .15s;
        }
        .btn:hover { opacity: .8; }
        .btn--sm { padding: 7px 14px; font-size: 11px; }
        .btn--outline { background: transparent; color: var(--text); }
        .btn--outline:hover { background: var(--text); color: #fff; opacity: 1; }
        .btn--danger { border-color: var(--danger); background: transparent; color: var(--danger); }
        .btn--danger:hover { background: var(--danger); color: #fff; opacity: 1; }
        .btn--block { width: 100%; }
        .btn:disabled { opacity: .35; cursor: not-allowed; }

        /* ================================
           空状態
           ================================ */
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            font-size: 13px;
        }

        /* ================================
           フォーム
           ================================ */
        .form-section-label {
            font-size: 11px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 600;
            margin: 28px 0 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .form-section-label:first-child { margin-top: 0; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .field { margin-bottom: 16px; }
        .field:last-child { margin-bottom: 0; }
        .field label {
            display: block;
            font-size: 12px;
            letter-spacing: .04em;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .field input[type="text"],
        .field input[type="date"],
        .field input[type="url"],
        .field input[type="password"],
        .field input[type="email"],
        .field select,
        .field textarea {
            width: 100%;
            border: 1px solid var(--border);
            padding: 10px 12px;
            font-size: 13.5px;
            font-family: inherit;
            background: #fff;
            color: var(--text);
            transition: border-color .15s;
        }
        .field input:focus, .field select:focus, .field textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        .field .hint { font-size: 11.5px; color: var(--muted); margin: 6px 0 0; }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            color: var(--text);
            cursor: pointer;
        }
        .checkbox-label input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
        .form-actions { display: flex; gap: 10px; margin-top: 32px; }

        /* ================================
           モバイル下部タブナビ
           ================================ */
        .admin-mobile-nav {
            display: none;
        }
        @media (max-width: 768px) {
            .admin-mobile-nav {
                display: flex;
                position: fixed;
                bottom: 0; left: 0; right: 0;
                height: 58px;
                background: var(--sidebar-bg);
                border-top: 1px solid rgba(255,255,255,.1);
                z-index: 200;
            }
            .admin-mobile-nav-link {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 4px;
                font-size: 10px;
                letter-spacing: .06em;
                color: rgba(255,255,255,.5);
                text-decoration: none;
                transition: color .15s;
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            .admin-mobile-nav-link.is-active { color: #fff; }
            .admin-mobile-nav-link svg { width: 20px; height: 20px; }

            .admin-sidebar { display: none; }
            .admin-content { padding: 20px 16px 80px; } /* タブバー分の余白 */
            .admin-topbar { padding: 0 16px; }
            .form-row { grid-template-columns: 1fr; }
            .admin-toolbar { flex-direction: column; align-items: flex-start; }
            .toolbar-search input { width: 100%; }

            .admin-table thead { display: none; }
            .admin-table tbody tr {
                display: block;
                border: 1px solid var(--border);
                margin-bottom: 10px;
                background: var(--card-bg);
            }
            .admin-table tbody tr:hover td { background: transparent; }
            .admin-table td {
                display: flex;
                gap: 8px;
                border: none;
                border-bottom: 1px solid #f0ebe3;
                font-size: 13px;
            }
            .admin-table td::before {
                content: attr(data-label);
                font-size: 10px;
                color: var(--muted);
                min-width: 60px;
                flex-shrink: 0;
                padding-top: 2px;
            }
            .admin-table td[data-label=""]::before { display: none; }
            .td-right { text-align: left; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
<div class="admin-shell">

    <!-- サイドバー -->
    <aside class="admin-sidebar">
        <div class="sidebar-logo">
            ei8ht plants
            <small>ADMIN</small>
        </div>
        <hr class="sidebar-divider">
        <nav class="sidebar-nav">
            <a href="/admin/events" class="sidebar-nav-link {% block nav_events %}{% endblock %}">Events</a>
            <a href="/admin/reservations" class="sidebar-nav-link {% block nav_reservations %}{% endblock %}">WS 予約</a>
            <a href="/admin/contacts" class="sidebar-nav-link {% block nav_contacts %}{% endblock %}">お問い合わせ</a>
        </nav>
        <a href="/admin/logout" class="sidebar-logout">ログアウト</a>
    </aside>

    <!-- メインエリア -->
    <div class="admin-main">
        <header class="admin-topbar">
            <h1>{% block page_heading %}{% endblock %}</h1>
            <div class="admin-topbar-actions">
                {% block topbar_actions %}{% endblock %}
            </div>
        </header>

        <div class="admin-content">
            {% block content %}{% endblock %}
        </div>
    </div>

</div>

<!-- スマホ用下部タブナビ -->
<nav class="admin-mobile-nav">
    <a href="/admin/events" class="admin-mobile-nav-link {% block mob_events %}{% endblock %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        Events
    </a>
    <a href="/admin/reservations" class="admin-mobile-nav-link {% block mob_reservations %}{% endblock %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        WS予約
    </a>
    <a href="/admin/contacts" class="admin-mobile-nav-link {% block mob_contacts %}{% endblock %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
        </svg>
        問い合わせ
    </a>
</nav>

</body>
</html>
