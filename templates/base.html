<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>{% block title %}ei8ht plants{% endblock %}</title>
    
    <!-- 400(標準)と500(中太)をメインに読み込み -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================================
            【デザイン・コントロールパネル】 一括設定エリア（CSS変数）
           ========================================================= */
        :root {
            --font-title-lg: 32px;
            --font-title-md: 24px;
            --font-info: 16px; 
            --font-tag: 12px;  
            --font-section: 20px; 
            --font-nav: 16px;  
            --font-small: 12px;

            --color-bg: #fafafa;
            --color-card-bg: #ffffff;
            --color-text-main: #333333;
            --color-text-sub: #444444; 
            --color-text-muted: #777777; 
            --color-border: #eaeaea;
            --color-link: #333333;
            
            --color-ws-bg: #fff8e1;
            --color-ws-border: #ffe082;
            --color-ws-text: #795548;

            --max-width: 1000px;
            --radius-card: 6px;
            --radius-tag: 3px;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", "Noto Sans JP", sans-serif; 
            color: var(--color-text-main); 
            background-color: var(--color-bg); 
            margin: 0; 
            padding: 0; 
            font-weight: 400; 
            -webkit-font-smoothing: antialiased; 
        }
        
        /* =========================================
            1. ヘッダー（共通・PC・スマホ統合）
           ========================================= */
        .site-header { 
            position: fixed; top: 0; left: 0; width: 100%; 
            min-height: 60px;
            background: rgba(255, 255, 255, 0.98); 
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--color-border); 
            z-index: 1000;
            display: flex; align-items: center; justify-content: space-between; 
            padding: 10px 30px; box-sizing: border-box; 
        }

        .header-brand { display: flex; align-items: center; height: 100%; text-decoration: none; }
        .header-logo-img { height: 32px; width: auto; object-fit: contain; transform: scale(1.1); }

        /* ハンバーガーボタン */
        .menu-btn {
            display: none;
            cursor: pointer;
            z-index: 1100;
            padding: 5px;
        }
        .menu-btn span {
            display: block;
            width: 25px;
            height: 2px;
            background: var(--color-text-main);
            margin: 5px 0;
            transition: 0.3s;
        }

        .header-nav { display: flex; gap: 20px; align-items: center; justify-content: flex-end; }
        
        .header-nav a { 
            font-size: var(--font-nav); 
            color: var(--color-text-muted); 
            font-weight: 500;
            letter-spacing: 1.5px;
            text-decoration: none; 
            transition: 0.3s; 
            white-space: nowrap;
            padding-bottom: 4px;
            border-bottom: 2px solid transparent;
        }
        
        .header-nav a:hover { color: var(--color-text-main); }

        /* ナビ強調表示（activeクラス） */
        .header-nav a.active {
            color: var(--color-text-main);
            border-bottom: 2px solid var(--color-text-main);
        }
        
        /* =========================================
            2. 共通ページヘッダー
           ========================================= */
        .page-header { text-align: center; padding: 50px 20px; background-color: var(--color-bg); }
        .page-title { font-size: var(--font-title-lg); font-weight: 400; letter-spacing: 4px; text-transform: uppercase; margin: 0; color: var(--color-text-main); }

        /* =========================================
            3. メインコンテンツ・共通レイアウト（元の要素を維持）
           ========================================= */
        .site-main { padding-top: 80px; min-height: 100vh; display: flex; flex-direction: column; } 
        .container { max-width: var(--max-width); margin: 40px auto; padding: 0 20px; width: 100%; box-sizing: border-box;}
        .section-header { font-size: var(--font-section); color: var(--color-text-muted); letter-spacing: 2px; text-transform: uppercase; margin: 60px 0 20px 0; border-bottom: 1px solid #ddd; padding-bottom: 10px; font-weight: 500; }
        .section-header:first-child { margin-top: 0; }
        
        .event-card { background: var(--color-card-bg); margin-bottom: 60px; overflow: hidden; border: 1px solid var(--color-border); display: flex; flex-direction: column; border-radius: var(--radius-card); }
        .image-wrap { width: 100%; min-height: 200px; background-color: #f9f9f9; }
        .event-image { width: 100%; height: auto; display: block; }
        .event-content { padding: 40px; }
        .event-title { font-size: var(--font-title-md); margin: 0 0 20px 0; font-weight: 500; line-height: 1.4; }
        
        .brand-tags { margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 8px; }
        .brand-tag { font-size: var(--font-tag); background: var(--color-text-main); color: #fff; padding: 6px 12px; border-radius: var(--radius-tag); letter-spacing: 1px; text-decoration: none; transition: 0.2s; font-weight: 500; }
        .brand-tag:hover { background: var(--color-text-sub); }
        
        .event-info { font-size: var(--font-info); color: var(--color-text-sub); background: #fdfdfd; padding: 15px; border-radius: var(--radius-card); border: 1px solid #f0f0f0; margin-bottom: 0;}
        .info-row { display: flex; align-items: flex-start; margin-bottom: 8px; line-height: 1.6;}
        .info-icon { margin-right: 8px; font-size: var(--font-info); opacity: 0.8;}
        .info-link { color: var(--color-link); text-decoration: underline; text-underline-offset: 3px;}
        
        .ws-box { background: var(--color-ws-bg); border: 1px solid var(--color-ws-border); padding: 20px; margin-top: 20px; border-radius: var(--radius-card); }
        .ws-title { display: block; font-weight: 500; color: var(--color-ws-text); font-size: var(--font-info); margin-bottom: 5px; }
        .ws-desc { font-size: 13px; color: #8d6e63; line-height: 1.5; display: block; }
        .ws-link { display: inline-block; margin-top: 12px; background: var(--color-ws-text); color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 4px; font-size: 12px; font-weight: bold; transition: 0.3s; }
        .ws-link:hover { background: #5d4037; }
        .ws-credit { display: block; margin-top: 15px; font-size: var(--font-small); color: #a1887f; line-height: 1.4; }
    
        .events-grid { display: grid; grid-template-columns: 1fr; gap: 30px; max-width: var(--max-width); margin: 0 auto 60px auto; }
        .events-grid .event-card { margin-bottom: 0; height: 100%; }
        
        .footer-copy { text-align: center; font-size: var(--font-small); color: #888; padding: 60px 0; margin-top: auto; }
    
        /* =========================================
            4. レスポンシブ
           ========================================= */
        @media (max-width: 768px) { 
            .site-header { padding: 10px 20px; min-height: 60px; }
            .header-logo-img { height: 26px; } 

            .menu-btn { display: block; }

            .header-nav {
                position: fixed; top: 0; right: -100%; width: 75%; height: 100vh;
                background: rgba(255, 255, 255, 0.98); flex-direction: column;
                justify-content: center; align-items: center; gap: 30px;
                transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1050;
                box-shadow: -5px 0 15px rgba(0,0,0,0.05);
            }
            .header-nav.nav-open { right: 0; }

            .menu-btn.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
            .menu-btn.open span:nth-child(2) { opacity: 0; }
            .menu-btn.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

            .site-main { padding-top: 70px; }
            .event-content { padding: 25px; } 
            .event-title { font-size: 20px; } 
            .events-grid .event-title { font-size: 18px; }
            .page-title { font-size: 24px; }
        }
        
        @media (min-width: 769px) {
            .events-grid { grid-template-columns: 1fr 1fr; gap: 30px; }
            .events-grid .event-content { padding: 25px; } 
            .next-card { flex-direction: row; }
            .next-card .image-wrap { width: 100%; }
            .next-card .event-content { width: 80%; padding: 40px; }
            .next-card .event-title { font-size: var(--font-title-md); }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <script>
        /* スライドショー制御（完全維持） */
        function moveSlide(btn, step) {
            const container = btn.closest('.event-slideshow');
            const slides = container.querySelectorAll('.slide');
            const dots = container.querySelectorAll('.dot');
            let current = parseInt(container.getAttribute('data-current-slide') || '0');
            slides[current].style.opacity = '0';
            slides[current].style.zIndex = '1';
            if(dots.length) dots[current].style.background = 'rgba(255,255,255,0.5)';
            current = (current + step + slides.length) % slides.length;
            slides[current].style.opacity = '1';
            slides[current].style.zIndex = '2';
            if(dots.length) dots[current].style.background = '#fff';
            container.setAttribute('data-current-slide', current);
        }
        function setSlide(dotElement, index) {
            const container = dotElement.closest('.event-slideshow');
            const slides = container.querySelectorAll('.slide');
            const dots = container.querySelectorAll('.dot');
            let current = parseInt(container.getAttribute('data-current-slide') || '0');
            slides[current].style.opacity = '0';
            slides[current].style.zIndex = '1';
            if(dots.length) dots[current].style.background = 'rgba(255,255,255,0.5)';
            slides[index].style.opacity = '1';
            slides[index].style.zIndex = '2';
            if(dots.length) dots[index].style.background = '#fff';
            container.setAttribute('data-current-slide', index);
        }

        /* ハンバーガーメニュー制御 */
        function toggleMenu() {
            const nav = document.getElementById('headerNav');
            const btn = document.querySelector('.menu-btn');
            nav.classList.toggle('nav-open');
            btn.classList.toggle('open');
            document.body.style.overflow = nav.classList.contains('nav-open') ? 'hidden' : '';
        }
    </script>

    <header class="site-header">
        <a href="/" class="header-brand">
            <img src="https://drive.google.com/thumbnail?id=1DZ7SiynuB-dVLsV_v08g_EdV-LsDPREa&sz=w500" class="header-logo-img" alt="ei8ht plants">
        </a>

        <div class="menu-btn" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <nav class="header-nav" id="headerNav">
            <a href="/" class="{{ 'active' if request.path == '/' }}">HOME</a>
            <a href="/events" class="{{ 'active' if request.path.startswith('/events') }}">EVENT</a>
            <a href="/gallery" class="{{ 'active' if request.path.startswith('/gallery') }}">GALLERY</a>
            <a href="/collaborations" class="{{ 'active' if request.path.startswith('/collaborations') }}">COLLABORATION</a>
            <a href="/concept" class="{{ 'active' if request.path == '/concept' }}">CONCEPT</a>
            <a href="https://ei8htplants.square.site/s/shop" target="_blank" rel="noopener noreferrer">ONLINE STORE</a>
        </nav>
    </header>

    <main class="site-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-copy">
            <p style="font-size: 12px; margin-bottom: 12px; color: #777; line-height: 1.6; letter-spacing: 0.5px;">
                ※「HABITATSTYLE / ハビタットスタイル」は Shabomaniac! (および THE SUCCULENTIST) の登録商標です。
            </p>
            <div style="color: #999; font-size: 12px;">
                © 2026 ei8ht plants. All Rights Reserved.
            </div>
        </div>
    </footer>
</body>
</html>
